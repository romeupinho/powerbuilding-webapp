<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050509" />
<title>Powerbuilding V2 Teste</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="../assets/css/styles.css" />
<link rel="stylesheet" href="./workout-v2.css" />
<script>
(() => {
  const LIVE_KEY = 'pb12_state_v1';
  const TEST_KEY = 'pb12_state_test_v2';
  const proto = Storage.prototype;
  const originalGetItem = proto.getItem;
  const originalSetItem = proto.setItem;
  const originalRemoveItem = proto.removeItem;
  proto.getItem = function(key) {
    return originalGetItem.call(this, key === LIVE_KEY ? TEST_KEY : key);
  };
  proto.setItem = function(key, value) {
    return originalSetItem.call(this, key === LIVE_KEY ? TEST_KEY : key, value);
  };
  proto.removeItem = function(key) {
    return originalRemoveItem.call(this, key === LIVE_KEY ? TEST_KEY : key);
  };
})();
</script>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" aria-label="Navegação principal">
  <button data-screen="home" class="active" type="button" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
    <span class="label">Home</span>
  </button>
  <button data-screen="plan" type="button" aria-label="Plano">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M6.5 12h11"/><path d="M2.5 10.5v3"/><path d="M21.5 10.5v3"/></svg>
    <span class="label">Plano</span>
  </button>
  <button data-screen="workout" class="center" type="button" aria-label="Treino">
    <span class="plusCircle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
  </button>
  <button data-screen="dashboard" type="button" aria-label="Stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 3.2-3.2 3 2.4L19 8"/><path d="M19 8v4"/><path d="M19 8h-4"/></svg>
    <span class="label">Stats</span>
  </button>
  <button data-screen="log" type="button" aria-label="Log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
    <span class="label">Log</span>
  </button>
</nav>
<div class="toast" id="toast">Guardado</div>
<script src="../assets/js/data.js" defer></script>
<script src="../assets/js/app.js" defer></script>
<script src="../assets/js/history-import.js" defer></script>
<script src="./workout-v2.js" defer></script>
</body>
</html>
